name: Aug19 Regression - Oh-Good + Hot Deal
on:
  schedule: [{ cron: "0 1 19 8 *" }] # Aug 19, 01:00 UTC — runs once automatically
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g pnpm && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project oh-good --project hot-deal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OH_GOOD_URL: ${{ secrets.OH_GOOD_URL }}
          HOT_DEAL_URL: ${{ secrets.HOT_DEAL_URL }}
          HOT_DEAL_SITE_PASSWORD: ${{ secrets.HOT_DEAL_SITE_PASSWORD }}
          # Fallbacks for the new main/staging key scheme (morning-check style)
          OH_GOOD_MAIN_URL: ${{ secrets.OH_GOOD_MAIN_URL }}
          OH_GOOD_STAGING_URL: ${{ secrets.OH_GOOD_STAGING_URL }}
          HOT_DEAL_MAIN_URL: ${{ secrets.HOT_DEAL_MAIN_URL }}
          HOT_DEAL_STAGING_URL: ${{ secrets.HOT_DEAL_STAGING_URL }}
