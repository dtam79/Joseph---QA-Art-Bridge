name: Morning Check
on:
  schedule: [{ cron: "0 0 * * *" }] # 00:00 UTC = 09:00 KST / 06:30 MMT
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g pnpm && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project morning-check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ART_BRIDGE_STAGING_URL: ${{ secrets.ART_BRIDGE_STAGING_URL }}
          ART_BRIDGE_USER: ${{ secrets.ART_BRIDGE_USER }}
          ART_BRIDGE_PASS: ${{ secrets.ART_BRIDGE_PASS }}
          HOT_DEAL_USER: ${{ secrets.HOT_DEAL_USER }}
          HOT_DEAL_PASS: ${{ secrets.HOT_DEAL_PASS }}
          OH_GOOD_MAIN_URL: ${{ secrets.OH_GOOD_MAIN_URL }}
          OH_GOOD_STAGING_URL: ${{ secrets.OH_GOOD_STAGING_URL }}
          HANDS_MAIN_URL: ${{ secrets.HANDS_MAIN_URL }}
          HANDS_STAGING_URL: ${{ secrets.HANDS_STAGING_URL }}
